# Build + type-check the static gallery

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      # The manifest is normally produced by `pnpm build:manifest` (S3 / local
      # photo pipeline). CI only needs the SPA to compile, so seed an empty one.
      - run: echo '{"version":"v2","data":[]}' > apps/web/src/data/photos-manifest.json

      # `vite build` also generates apps/web/src/generated-routes.ts.
      - name: Build SPA
        run: pnpm exec vite build
        working-directory: ./apps/web

      - name: Type check
        run: pnpm type-check
