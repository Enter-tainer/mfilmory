<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="<%- description %>" />

    <!-- PWA iOS Safari 配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="<%- title %>" />

    <title><%- title %></title>
    <!-- 字体自托管：不再从 fonts.googleapis.com 拉一份渲染阻塞的 CSS（实测那一跳要 1.3 s，
         而且会给首屏多加 2 个跨域 RTT）。Geist 只覆盖拉丁字形，中文本来就走系统字体回退。 -->
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      html {
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
      }
    </style>
    <script id="config">
      window.__CONFIG__ = {}
      window.__SITE_CONFIG__ = {}
    </script>
    <script id="manifest"></script>
  </head>
  <body>
    <div id="root">
      <!-- Splash Screen - 现代简洁设计 -->
      <div
        id="splash-screen"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: #0a0a0a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
          overflow: hidden;
        "
      >
        <!-- 主要内容 -->
        <div
          style="
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            text-align: center;
          "
        >
          <!-- Logo -->
          <div
            style="
              width: 3.5rem;
              height: 3.5rem;
              background: rgba(255, 255, 255, 0.85);
              border-radius: 1.25rem;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 4px 16px rgba(0, 0, 0, 0.4);
              backdrop-filter: blur(10px);
            "
          >
            <!-- 相机图标 -->
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#0a0a0a"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M3 9a2 2 0 0 1 2-2h.93a2 2 0 0 0 1.664-.89l.812-1.22A2 2 0 0 1 10.07 4h3.86a2 2 0 0 1 1.664.89l.812 1.22A2 2 0 0 0 18.07 7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"
              />
              <circle cx="12" cy="13" r="3" />
            </svg>
          </div>

          <!-- 应用标题 -->
          <div style="display: flex; flex-direction: column; gap: 0.75rem">
            <h1
              style="
                font-size: 1.75rem;
                font-weight: 600;
                letter-spacing: -0.025em;
                color: rgba(255, 255, 255, 0.85);
                margin: 0;
              "
            >
              <%- title %>
            </h1>
            <p
              style="
                color: rgba(255, 255, 255, 0.5);
                font-size: 0.875rem;
                margin: 0;
                font-weight: 400;
                letter-spacing: 0.01em;
              "
            >
              <%- description %>
            </p>
          </div>

          <!-- 加载动画 -->
          <div style="margin-top: 1rem">
            <!-- 点状加载器：这是唯一负责「还在加载」视觉暗示的元素，立刻可见 -->
            <div style="display: flex; gap: 0.5rem; align-items: center">
              <div
                style="
                  width: 0.375rem;
                  height: 0.375rem;
                  background: rgba(255, 255, 255, 0.6);
                  border-radius: 50%;
                  animation: dotPulse 1.4s ease-in-out infinite;
                "
              ></div>
              <div
                style="
                  width: 0.375rem;
                  height: 0.375rem;
                  background: rgba(255, 255, 255, 0.6);
                  border-radius: 50%;
                  animation: dotPulse 1.4s ease-in-out infinite 0.2s;
                "
              ></div>
              <div
                style="
                  width: 0.375rem;
                  height: 0.375rem;
                  background: rgba(255, 255, 255, 0.6);
                  border-radius: 50%;
                  animation: dotPulse 1.4s ease-in-out infinite 0.4s;
                "
              ></div>
            </div>
          </div>
        </div>

        <!-- CSS 动画 -->
        <style>

          @keyframes dotPulse {
            0%,
            100% {
              opacity: 0.3;
              transform: scale(0.8);
            }
            50% {
              opacity: 1;
              transform: scale(1);
            }
          }

          /* 响应式设计 */
          @media (max-width: 640px) {
            #splash-screen h1 {
              font-size: 1.5rem;
            }
            #splash-screen p {
              font-size: 0.8rem;
            }
          }

          @media (max-width: 480px) {
            #splash-screen h1 {
              font-size: 1.375rem;
            }
            #splash-screen [style*='gap: 2rem'] {
              gap: 1.5rem !important;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
